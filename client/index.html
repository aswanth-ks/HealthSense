<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HealthSense</title>
    <meta name="description" content="HealthSense — 24-Hour Closed-Loop Triage System. Risk-pattern identification and triage support; not a diagnosis." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#126b5c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HealthSense" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Splash screen: visible until React mounts (removed in main.jsx) -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f5f8f7; font-family: Inter, system-ui, sans-serif; transition: opacity .35s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(18,107,92,.25); animation: hs-pulse 1.6s ease-in-out infinite; }
      #splash h1 { margin: 20px 0 4px; font-size: 24px; font-weight: 600; color: #0f1f1d; letter-spacing: -0.02em; }
      #splash p { margin: 0; font-size: 13px; color: #5b6b68; }
      #splash .bar { margin-top: 28px; width: 120px; height: 3px; border-radius: 3px; background: #d5eeea; overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #1f9a86; border-radius: 3px; animation: hs-load 1.1s ease-in-out infinite; }
      #splash small { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); font-size: 11px; color: #8a9895; padding: 0 24px; text-align: center; }
      @keyframes hs-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes hs-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading HealthSense">
      <img src="/icons/icon-192.png" alt="" />
      <h1>HealthSense</h1>
      <p>24-Hour Closed-Loop Triage System</p>
      <div class="bar"></div>
      <small>Risk-pattern identification and triage support — not a medical diagnosis.</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
